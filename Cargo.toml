[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A terminal preview of a Markdown file that follows each save"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
