[package]
name = "mdlive"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A terminal preview of a Markdown file that follows each save"
repository = "https://github.com/GF6599/mdlive"
homepage = "https://github.com/GF6599/mdlive"
# Released as archives and a Homebrew cask, not on crates.io.
publish = false

[dependencies]
base64 = "0.23"
crossterm = "0.29"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mermaid-text = "0.57"
notify-debouncer-mini = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
resvg = "0.49"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
techxt = "0.1.1"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dev-dependencies]
tempfile = "3"
