# cargo-deny configuration. `just deny` runs it, and `just check` includes it.
# Every key absent here keeps the cargo-deny default.

[licenses]
# The SPDX identifiers present in Cargo.lock, each a permissive licence that
# lets the crate ship inside an MIT binary. Add one only as a deliberate
# decision about a new dependency, never as a glob.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained, not vulnerable, and its authors call it
    # complete. syntect uses it only to decode the syntax dump compiled into
    # the binary, never data from a page.
    { id = "RUSTSEC-2025-0141", reason = "syntect decodes only its own embedded syntax dump" },
    # ttf-parser is unmaintained, not vulnerable. Only the Mermaid renderer
    # uses it, to measure label text in the fonts installed on the system,
    # never a font that a page or a diagram supplies.
    { id = "RUSTSEC-2026-0192", reason = "parses only the system fonts the Mermaid renderer loads" },
]

[bans]
# A warning and not a denial: resvg and the Mermaid renderer each hold their
# own fontdb and roxmltree, and the image and syntax crates pull older rand,
# syn and thiserror lines. Make it "deny" when the graph holds one of each.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
